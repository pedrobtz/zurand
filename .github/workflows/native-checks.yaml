on:
  # No `push:`: a pull request already checks its merge with main,
  # and the schedule checks main (r-actions README, "Pushes to main").
  schedule:
    - cron: "24 16 * * 0"
  workflow_dispatch:
  # `labeled`/`unlabeled` so that adding or removing a CI label (`full-ci`,
  # `ci:minimal`, `skip-ci:<workflow>`) reruns it.
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

name: native-checks

# Required, not decorative: this repository's default_workflow_permissions is
# "read", and every called workflow declares `permissions: read-all`. Without
# this the whole workflow is rejected at startup before any job runs.
permissions: read-all

jobs:
  sanitizers:
    uses: pedrobtz/r-actions/.github/workflows/sanitizers.yml@4062705ecc3560e85ec8045b30d0e9951fa447a2 # v1.30.0
    with:
      asan: true
      profile: auto

  valgrind:
    uses: pedrobtz/r-actions/.github/workflows/valgrind.yml@4062705ecc3560e85ec8045b30d0e9951fa447a2 # v1.30.0
    with:
      profile: auto
      # libgomp's pooled worker threads keep their TLS until exit, which
      # --leak-check=full reports as "possibly lost". See the file.
      suppressions: .github/valgrind.supp

  lto:
    uses: pedrobtz/r-actions/.github/workflows/lto.yml@4062705ecc3560e85ec8045b30d0e9951fa447a2 # v1.30.0

  gctorture:
    uses: pedrobtz/r-actions/.github/workflows/gctorture.yml@4062705ecc3560e85ec8045b30d0e9951fa447a2 # v1.30.0
    with:
      profile: auto

  rchk:
    uses: pedrobtz/r-actions/.github/workflows/rchk.yml@4062705ecc3560e85ec8045b30d0e9951fa447a2 # v1.30.0

  analyzers:
    uses: pedrobtz/r-actions/.github/workflows/analyzers.yml@4062705ecc3560e85ec8045b30d0e9951fa447a2 # v1.30.0
    with:
      # Random123 and NumPy's ziggurat tables are vendored (verbatim; NumPy's
      # trimmed to the tables used) and are
      # not ours to fix upstream. Excluded findings still appear in the job
      # summary under their own heading.
      exclude: |
        src/Random123
        src/numpyzig

  # CRAN's rcnst, rlibro and vnu checks -- the "Additional issues" nothing
  # above reproduces. Full runs only: `quick`, which skips all three, on
  # pull requests; full on every other event.
  cran-special:
    uses: pedrobtz/r-actions/.github/workflows/cran-special.yml@4062705ecc3560e85ec8045b30d0e9951fa447a2 # v1.30.0
    with:
      profile: auto
