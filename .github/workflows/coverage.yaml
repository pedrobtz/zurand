on:
  push:
    branches: [main, master]
  pull_request:

name: coverage

jobs:
  coverage:
    uses: pedrobtz/r-actions/.github/workflows/coverage.yml@8781563ab183217e586e11d90fdda7fd7ea697a3 # v1.25.0
    permissions:
      contents: write
    with:
      # zurand is ~900 lines of C behind ~250 lines of R wrapper, so the covr
      # number alone says very little about what the tests actually reach.
      native: true
      # The default runner does `Rscript tests/testthat.R` from the repo root,
      # where test_check() looks for ./testthat and finds nothing. R CMD check
      # runs test files with tests/ as the working directory; match that.
      native-run: cd tests && Rscript testthat.R
      # main's ruleset takes no direct pushes, so the badge commit goes to
      # gh-pages, which pkgdown.yaml already deploys to (without force-push,
      # so a badge commit landing mid-deploy is kept).
      badge-branch: gh-pages
      badge-path: badges/coverage.svg
