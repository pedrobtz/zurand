# Temporary: ziggurat transform variants on Apple Silicon. Not for main.
on:
  push:
    branches: ['microbench/**']
name: microbench
permissions: read-all
jobs:
  m1:
    strategy:
      fail-fast: false
      matrix:
        slot: [1, 2]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: cc -O2 -Isrc -o zc dev/simd/zig_compare.c && ./zc
