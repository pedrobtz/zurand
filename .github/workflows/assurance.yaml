# Holds .agents/assurance.md to the portfolio standard
# (.claude/shared/assurance.md), and the package's own workflows to ci.md's
# gating rule. Seconds; not gated, since the file is Markdown under a dot
# directory.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  workflow_dispatch:

name: assurance

permissions:
  contents: read

jobs:
  assurance:
    uses: pedrobtz/r-actions/.github/workflows/assurance.yml@ae59a2805e622e9ba0f3e902bc5f39eba33c6670 # v1.45.1
    with:
      ungated-jobs: fail
